# Imagem Docker do app (05/11/2026): a cada mudança no main, o GitHub constrói
# a imagem e publica em ghcr.io/facilweb01-alt/app-financeiro (tags "latest" e
# o commit). O VPS da Hostinger só baixa a imagem pronta — o build não pesa no
# servidor onde também rodam a Evolution e o n8n.
name: Imagem Docker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: imagem-docker
  cancel-in-progress: true

jobs:
  imagem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/facilweb01-alt/app-financeiro:latest
            ghcr.io/facilweb01-alt/app-financeiro:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
