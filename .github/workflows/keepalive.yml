# Mantém o app acordado no plano gratuito do Render durante o dia (7h–23h de
# Brasília), para mensagens de WhatsApp e avisos de pagamento do Asaas não
# pegarem o app "dormindo" (página de carregando, erro 503).
# Fica fora da madrugada para caber nas 750 horas/mês do plano gratuito.
# Se o app for para um plano pago do Render, este arquivo pode ser apagado.
name: Manter app acordado

on:
  schedule:
    - cron: "*/10 10-23,0-1 * * *" # UTC → 7h às 22h50 em Brasília
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Acordar app-financeiro
        run: curl -fsS --retry 5 --retry-delay 15 --max-time 60 https://app-financeiro-yswn.onrender.com/api/health || true
